
services:
  api:
    build: .
    container_name: ongadocao-api

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/OngAdocaoAPI
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}

    depends_on:
      mongo:
        condition: service_healthy

    volumes:
      - ./uploads:/app/uploads

    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: ongadocao-mongo

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep 1
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  mongo_data:
